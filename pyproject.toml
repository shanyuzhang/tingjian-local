[project]
name = "local-lecsync"
version = "0.1.0"
description = "Private lecture transcription and notes for Apple Silicon"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20",
  "mlx-whisper>=0.4.2,<0.5",
  "mlx-lm>=0.26,<1",
  "litert-lm-api>=0.18,<0.19",
  "imageio-ffmpeg>=0.6,<1",
  "websockets>=15,<17",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
